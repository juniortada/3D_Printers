# =============================================================================
#  Ventoinhas  ·  MKS Monster8 V2  ·  2 ferramentas (toolchanger)
# -----------------------------------------------------------------------------
#  Estrategia de fan do toolchanger (2 ferramentas):
#    FAN0 (PA2) = cooling da PECA da T0 (2x 4010 blower em cabo Y = 1 conector).
#    FAN2 (PA0) = cooling da PECA da T1 (idem) - saida LIBERADA porque o fan do
#                 break saiu da placa para a fonte 24V.
#    FAN1 (PA1) = ventoinha da camara (controlada por temperatura).
#
#  Fan do BREAK (3010) de cada hotend -> ligado DIRETO na fonte 24V (always-on,
#  fora da placa). Nao usa pino e e o estado seguro (sempre resfriando o break).
#
#  Cada [tool] (toolchanger.cfg) referencia seu fan de peca via 'fan:'. O
#  toolchanger roteia M106/M107 para a ferramenta ATIVA automaticamente.
# =============================================================================

#  Cooling da peca - T0 (FAN0)
[fan_generic partfan_t0]
pin: PA2

#  Cooling da peca - T1 (FAN2, liberado do antigo heatbreak)
[fan_generic partfan_t1]
pin: PA0

#  Camara (FAN1) + sensor da camara (EPCOS 100K, TH1/PC2).
#  Esta secao tambem mostra a temperatura da camara no Mainsail.
#  Comportamento: ventoinha acelera quando a camara passa de target_temp
#  (exaustao/resfriamento) - equivale ao CHAMBER_FAN do Marlin.
[temperature_fan chamber]
pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC2
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 90                      # Marlin CHAMBER_MAXTEMP
target_temp: 40
max_speed: 1.0
min_speed: 0.0

#  --- Fans do break ---
#  NAO ha [heater_fan] aqui: os breaks (3010) das duas ferramentas vao direto
#  na fonte 24V (always-on). Se um dia quiser controla-los pela placa, seria
#  preciso liberar/achar saidas PWM extras (a Monster8 esta no limite).
