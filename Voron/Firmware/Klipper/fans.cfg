# =============================================================================
#  Ventoinhas  ·  MKS Monster8 V2
# -----------------------------------------------------------------------------
#  FAN0 (PA2) = cooling da peca.
#  FAN1 (PA1) = ventoinha da camara, controlada pela temperatura (igual Marlin
#               CHAMBER_FAN: liga/acelera quando a camara passa do alvo).
#  FAN2 (PA0) = no Marlin estava desabilitado (FAN2_PIN -1). Bloco do
#               heater_fan do hotend fica comentado abaixo (ver nota).
# =============================================================================

#  Cooling da peca (FAN0)
[fan]
pin: PA2

#  Camara (FAN1) + sensor da camara (EPCOS 100K, TH1/PC2).
#  Esta secao tambem mostra a temperatura da camara no Mainsail.
#  Comportamento: ventoinha acelera quando a camara passa de target_temp
#  (exaustao/resfriamento) - equivale ao CHAMBER_FAN do Marlin.
#  Para so monitorar (sem controlar a ventoinha), troque por
#  [temperature_sensor chamber] + [fan_generic chamber_fan].
[temperature_fan chamber]
pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC2
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 90                      # Marlin CHAMBER_MAXTEMP
target_temp: 40
max_speed: 1.0
min_speed: 0.0

#  --- Hotend heatbreak fan (FAN2/PA0) ---
#  No Marlin estava como always-on/desabilitado. Boa pratica e controlar
#  pela temperatura do hotend. Se a ventoinha do break estiver ligada neste
#  conector, descomente:
#[heater_fan hotend_fan]
#pin: PA0
#heater: extruder
#heater_temp: 50.0
#shutdown_speed: 1.0
