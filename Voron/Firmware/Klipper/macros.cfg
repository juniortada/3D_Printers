# =============================================================================
#  Macros  ·  Voron 2.4 / MKS Monster8 V2
# -----------------------------------------------------------------------------
#  No slicer, use no Start G-code:   PRINT_START EXTRUDER={...} BED={...}
#                       End G-code:   PRINT_END
# =============================================================================

[gcode_macro G32]
description: Home + Quad Gantry Level + Home
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28

[gcode_macro PRINT_START]
description: Inicio de impressao (chamado pelo slicer)
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    M140 S{BED}                     ; liga a mesa
    M104 S150                       ; pre-aquece o bico (sem escorrer)
    G28                             ; home
    M190 S{BED}                     ; espera a mesa
    QUAD_GANTRY_LEVEL               ; nivela o portico (4 Z)
    G28 Z                           ; re-home Z apos QGL
    BED_MESH_CALIBRATE              ; malha da mesa
    G90
    G1 X152.5 Y152.5 Z10 F3600      ; vai ao centro
    M109 S{EXTRUDER}                ; espera o bico
    # (opcional) adicione aqui uma linha de purga/prime

[gcode_macro PRINT_END]
description: Fim de impressao (chamado pelo slicer)
gcode:
    M400                            ; esvazia o buffer
    G92 E0
    G1 E-10.0 F3600                 ; retrai
    G91
    G0 Z2.0 X20.0 Y20.0 F20000      ; afasta o bico
    TURN_OFF_HEATERS
    M107                            ; desliga cooling
    G90
    G0 X152.5 Y300 F3600            ; estaciona atras
    BED_MESH_CLEAR

[gcode_macro CANCEL_PRINT]
description: Cancela a impressao em andamento
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    CANCEL_PRINT_BASE
