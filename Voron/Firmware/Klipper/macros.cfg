# =============================================================================
#  Macros  ·  Voron 2.4 / MKS Monster8 V2
# -----------------------------------------------------------------------------
#  No slicer, use no Start G-code:   PRINT_START EXTRUDER={...} BED={...}
#                       End G-code:   PRINT_END
# =============================================================================

[gcode_macro G32]
description: Home + Quad Gantry Level + Home (usa a T0 como referencia de Z)
gcode:
    BED_MESH_CLEAR
    G28 X Y                         ; XY primeiro (Z precisa de ferramenta)
    T0                              ; acopla a T0 -> OptoTap dela e o probe de Z
    G28 Z
    QUAD_GANTRY_LEVEL
    G28 Z                           ; re-home Z apos QGL

[gcode_macro PRINT_START]
description: Inicio de impressao (chamado pelo slicer)
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    M140 S{BED}                     ; liga a mesa
    G28 X Y                         ; home XY (Z precisa de ferramenta)
    T0                              ; T0 = referencia p/ QGL e Z (OptoTap da T0)
    M104 S150                       ; pre-aquece o bico (reduz drift no probe)
    M190 S{BED}                     ; espera a mesa
    G28 Z                           ; home Z com o OptoTap da T0
    QUAD_GANTRY_LEVEL               ; nivela o portico (4 Z)
    G28 Z                           ; re-home Z apos QGL
    BED_MESH_CALIBRATE              ; malha da mesa
    G90
    G1 X152.5 Y152.5 Z10 F3600      ; vai ao centro
    M109 S{EXTRUDER}                ; espera o bico da ferramenta ativa
    # As trocas de ferramenta (T0/T1) e temperaturas por ferramenta vem do
    # slicer (tool change G-code). (opcional) purga/prime por ferramenta aqui.

[gcode_macro PRINT_END]
description: Fim de impressao (chamado pelo slicer)
gcode:
    M400                            ; esvazia o buffer
    G92 E0
    G1 E-10.0 F3600                 ; retrai
    G91
    G0 Z2.0 X20.0 Y20.0 F20000      ; afasta o bico
    G90
    TURN_OFF_HEATERS
    M107                            ; desliga cooling
    # Estaciona a ferramenta ativa no dock (NAO volta pra T0). No proximo boot,
    # DETECT_ACTIVE_TOOL_PROBE descobre o estado. Confira o nome do comando na
    # versao do klipper-toolchanger instalada (SELECT_TOOL/UNSELECT_TOOL).
    UNSELECT_TOOL
    G0 X152.5 Y300 F3600            ; estaciona o portico atras
    BED_MESH_CLEAR

[gcode_macro CANCEL_PRINT]
description: Cancela a impressao em andamento
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    CANCEL_PRINT_BASE
