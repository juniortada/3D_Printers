# =============================================================================
#  Toolchanger  ·  2 ferramentas  ·  Voron 2.4 / MKS Monster8 V2
# -----------------------------------------------------------------------------
#  Sistema HIBRIDO:
#    - Probe de Z: OptoTap por ferramenta (ecossistema Tapchanger).
#    - Docks/acoplamento: base modular do StealthChanger (adaptador Dragonburner).
#
#  >>> PRE-REQUISITO: instalar o modulo 'viesturz/klipper-toolchanger' no host
#      (git clone + install.sh) e adicionar o update_manager no moonraker.conf.
#      Sem o modulo, as secoes [toolchanger]/[tool]/[tool_probe]/[tool_probe_endstop]
#      NAO sao reconhecidas e o Klipper acusa erro de config.
#
#  >>> VALORES A CALIBRAR (marcados com CALIBRAR):
#      - params_park_x/y/z de cada ferramenta (posicao do dock).
#      - o "caminho" de pega/largada (params_sc_*) -> usar o gerador/config de
#        referencia do StealthChanger para a SUA geometria de dock.
#      - gcode_*_offset do T1 (offset bico-a-bico vs T0).
#      - z_offset de cada [tool_probe] (trigger do OptoTap vs bico na mesa).
# =============================================================================

[toolchanger]
t_command_restore_axis: XYZ
# Detecta a ferramenta montada no boot (nao precisa voltar pra T0 no fim do print).
# 'manual' = nao tenta trocar sozinho ao iniciar; a deteccao roda no delayed_gcode
# _DETECT_TOOL_ON_BOOT (fim deste arquivo).
initialize_on_start: false
uses_axis: xyz
# Velocidades dos movimentos de troca (StealthChanger). CALIBRAR conforme a
# referencia do StealthChanger para a sua maquina.
params_fast_speed: 20000
params_path_speed: 2000

#####################################################################
#   Ferramenta 0 (referencia)  ·  extruder + partfan_t0 + OptoTap PB13
#####################################################################
[tool T0]
tool_number: 0
extruder: extruder
fan: partfan_t0
# T0 e a referencia -> offsets ZERO. Os offsets do T1 sao medidos em relacao a ela.
gcode_x_offset: 0.0
gcode_y_offset: 0.0
gcode_z_offset: 0.0
# --- Posicao do dock (CALIBRAR na sua maquina) ---
params_park_x: 0.0                # CALIBRAR
params_park_y: 0.0                # CALIBRAR
params_park_z: 0.0                # CALIBRAR
# --- Caminho de pega/largada (StealthChanger) ---
# Preencher com o caminho do StealthChanger (ex.: params_sc_path / params_sc_*).
# Ver config de referencia do StealthChanger (docs sdylewski).

#####################################################################
#   Ferramenta 1  ·  extruder1 + partfan_t1 + OptoTap PA8
#####################################################################
[tool T1]
tool_number: 1
extruder: extruder1
fan: partfan_t1
# Offset do bico do T1 em relacao ao T0 (CALIBRAR: bico-a-bico ou por camera).
gcode_x_offset: 0.0               # CALIBRAR
gcode_y_offset: 0.0               # CALIBRAR
gcode_z_offset: 0.0               # CALIBRAR
# --- Posicao do dock (CALIBRAR na sua maquina) ---
params_park_x: 0.0                # CALIBRAR
params_park_y: 0.0                # CALIBRAR
params_park_z: 0.0                # CALIBRAR
# --- Caminho de pega/largada (StealthChanger) --- (idem T0)

#####################################################################
#   OptoTap  ·  1 probe por ferramenta
#   Cada OptoTap num pino de endstop liberado ao remover o BLTouch:
#     T0 -> PB13 (antigo Z-MIN)   ·   T1 -> PA8 (antigo SERVO0)
#   Conferir a polaridade da placa OptoTap: se ficar invertido, use ^! no pino.
#####################################################################
[tool_probe T0]
pin: ^PB13
tool: 0
z_offset: 0.0                     # CALIBRAR (trigger do OptoTap vs bico na mesa)
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

[tool_probe T1]
pin: ^PA8
tool: 1
z_offset: 0.0                     # CALIBRAR
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

#  Coordenador central dos probes: fornece 'probe:z_virtual_endstop' (usado no
#  [stepper_z]), roteia comandos de probe p/ a ferramenta ativa e habilita
#  DETECT_ACTIVE_TOOL_PROBE. crash_mintime: tempo minimo de trigger p/ considerar
#  crash (nozzle deixou de tocar antes do esperado).
[tool_probe_endstop]
crash_mintime: 0.5

#####################################################################
#   Deteccao da ferramenta ativa no BOOT
#   Le o estado dos OptoTaps: a ferramenta cujo probe NAO esta disparado e a
#   MONTADA. Assim nao e preciso voltar pra T0 no fim de cada impressao.
#   Se NENHUMA estiver montada (todas docadas/disparadas) -> sem ferramenta
#   ativa; o PRINT_START seleciona a ferramenta antes de mexer no Z.
#####################################################################
[delayed_gcode _DETECT_TOOL_ON_BOOT]
initial_duration: 1
gcode:
    DETECT_ACTIVE_TOOL_PROBE
