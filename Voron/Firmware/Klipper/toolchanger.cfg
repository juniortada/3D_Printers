# =============================================================================
#  Toolchanger  ·  2 ferramentas  ·  Voron 2.4 / MKS Monster8 V2
# -----------------------------------------------------------------------------
#  Sistema HIBRIDO:
#    - Probe de Z: OptoTap por ferramenta (ecossistema Tapchanger).
#    - Docks/acoplamento: base modular do StealthChanger (adaptador Dragonburner).
#
#  >>> PRE-REQUISITO: instalar o modulo 'viesturz/klipper-toolchanger' no host
#      (git clone + install.sh) e adicionar o update_manager no moonraker.conf.
#      Sem o modulo, as secoes [toolchanger]/[tool]/[tool_probe]/[tool_probe_endstop]
#      NAO sao reconhecidas e o Klipper acusa erro de config.
#
#  >>> VALORES A CALIBRAR (marcados com CALIBRAR):
#      - params_park_x/y/z de cada ferramenta (posicao do dock).
#      - o "caminho" de pega/largada (params_sc_*) -> usar o gerador/config de
#        referencia do StealthChanger para a SUA geometria de dock.
#      - gcode_*_offset do T1 (offset bico-a-bico vs T0).
#      - z_offset de cada [tool_probe] (trigger do OptoTap vs bico na mesa).
# =============================================================================

[toolchanger]
t_command_restore_axis: XYZ
# initialize_on: home | manual | first-use  (default first-use)
#   'manual' = NAO tenta acoplar sozinho ao ligar; a deteccao da ferramenta
#   montada roda no delayed_gcode _DETECT_TOOL_ON_BOOT (fim deste arquivo).
#   Assim nao e preciso voltar pra T0 no fim do print.
#   (Se o modulo reclamar de "not initialized" ao usar T0, adicione
#    INITIALIZE_TOOLCHANGER no _DETECT_TOOL_ON_BOOT antes do DETECT.)
initialize_on: manual
uses_axis: xyz
# Velocidades dos movimentos de troca (StealthChanger). CALIBRAR conforme a
# referencia do StealthChanger para a sua maquina.
params_fast_speed: 10000    #20000
params_path_speed: 1200     #2000

# --- Posicoes de aproximacao/retirada (usadas pelos gcodes de dock) - CALIBRAR ---
params_safe_y: 110                 # Y "seguro", longe do dock (evita arrastar o bico)
params_close_y: 20                # Y proximo ao dock (troca ferramenta -> ferramenta)

# --- LARGADA (dropoff): percorre params_dropoff_path do [tool] ativo ---
dropoff_gcode:
	RESPOND MSG=">>> EXECUTANDO DROPOFF <<<"
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set z = tool.params_park_z|float %}
    {% set fast = tool.params_fast_speed|float %}
    {% set path = tool.params_dropoff_path %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set cur_z = printer.toolhead.position[2]|float %}
    RESPOND TYPE=echo MSG='Largando {tool.name}'
    G90
    G0 Z{ [cur_z+1.0, max_z]|min } F{fast}          ; sobe 1mm p/ nao arrastar
    ROUNDED_G0 Y={tool.params_safe_y} D=20 F={fast}
    ROUNDED_G0 X={x} D=150 F={fast}
    ROUNDED_G0 Z={z + path[0]['z']|float} D=20 F={fast}
    ROUNDED_G0 Y={y + path[0]['y']|float} D=0 F={fast}
    {% for pos in path %}
      {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
    {% endfor %}
    {% if pickup_tool is none %}
      G0 Y{tool.params_safe_y} F{fast}
    {% endif %}

# --- PEGA (pickup): percorre params_pickup_path do [tool] alvo ---
pickup_gcode:
	RESPOND MSG=">>> EXECUTANDO PICKUP <<<"
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set z = tool.params_park_z|float %}
    {% set fast = tool.params_fast_speed|float %}
    {% set path = tool.params_pickup_path %}
    RESPOND TYPE=echo MSG='Pegando {tool.name}'
    G90
    ROUNDED_G0 Y={tool.params_safe_y} D=20 F={fast}
    ROUNDED_G0 X={x} Z={z + path[0]['z']|float} F={fast} D=5
    ROUNDED_G0 Y={y + path[0]['y']|float} F={fast} D=0
    # Espera temperatura ANTES de acoplar (so se houver alvo > 0 -> teste a frio nao trava).
    {% if tool.extruder and printer[tool.extruder].target|float > 0 %}
      M109 T{tool.tool_number} S{printer[tool.extruder].target|int}
    {% endif %}
    {% for pos in path %}
      {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
      # 'verify' do path DESATIVADO por enquanto (deteccao durante a troca com OptoTap
      # ainda nao configurada; reabilitar VERIFY_TOOL_DETECTED aqui depois).
    {% endfor %}
    ROUNDED_G0 Y={tool.params_safe_y} F={fast} D=20
    {% if 'Z' in restore_position %}
      ROUNDED_G0 Z={restore_position.Z} F={fast} D=150
    {% endif %}
    {% if 'X' in restore_position %}
      ROUNDED_G0 X={restore_position.X} F={fast} D=1000
    {% endif %}
    {% if 'Y' in restore_position %}
      ROUNDED_G0 Y={restore_position.Y} F={fast} D=0
    {% endif %}
    ROUNDED_G0 D=0

#####################################################################
#   Ferramenta 0 (referencia)  ·  extruder + partfan_t0 + OptoTap PA8 (3D TOUCH)
#####################################################################
[tool T0]
tool_number: 0
extruder: extruder
fan: partfan_t0
# T0 e a referencia -> offsets ZERO. Os offsets do T1 sao medidos em relacao a ela.
gcode_x_offset: 0.0
gcode_y_offset: 0.0
gcode_z_offset: 0.0
# --- Posicao do dock (CALIBRAR na sua maquina) ---
params_park_x: 24
params_park_y: 18
params_park_z: 246.0
# --- Caminho de pega/largada (StealthChanger) ---
# Ver config de referencia StealthChanger https://github.com/viesturz/klipper-toolchanger/blob/main/examples/tool_paths.md
params_dropoff_path: [{'z':3.5, 'y':4}, {'z':0, 'y':0}, {'z':-12, 'y':0}]
params_pickup_path: [{'z':-12, 'y':2}, {'z':-12, 'y':0}, {'z':1.5, 'y':0, 'f':0.5, 'verify':1}, {'z':0.5, 'y':2.5, 'f':0.5}, {'z':8, 'y':8}, ]  

#####################################################################
#   Ferramenta 1  ·  extruder1 + partfan_t1 + OptoTap PB13 (endstop Z-)
#####################################################################
[tool T1]
tool_number: 1
extruder: extruder1
fan: partfan_t1
# Offset do bico do T1 em relacao ao T0 (CALIBRAR: bico-a-bico ou por camera).
gcode_x_offset: -1.1               # CALIBRAR
gcode_y_offset: 0.8                # + positivo, y move para fundo da impressora
gcode_z_offset: 0.05               # + afasta bico da mesa | - aproxima
# --- Posicao do dock (CALIBRAR na sua maquina) ---
params_park_x: 93.5                # CALIBRAR
params_park_y: 17                # CALIBRAR
params_park_z: 246                # CALIBRAR
# --- Caminho de pega/largada (StealthChanger) --- (idem T0)
params_dropoff_path: [{'z':3.5, 'y':4}, {'z':0, 'y':0}, {'z':-12, 'y':0}]
params_pickup_path: [{'z':-12, 'y':2}, {'z':-12, 'y':0}, {'z':1.5, 'y':0, 'f':0.5, 'verify':1}, {'z':0.5, 'y':2.5, 'f':0.5}, {'z':8, 'y':8}, ]

#####################################################################
#   Ferramenta 2  ·  ebb_t2
#####################################################################
[tool T2]
tool_number: 2
extruder: extruder2
fan: partfan_t2
# Offset do bico do T1 em relacao ao T0 (CALIBRAR: bico-a-bico ou por camera).
gcode_x_offset: 0.0               # CALIBRAR
gcode_y_offset: 0.0                # + positivo, y move para fundo da impressora
gcode_z_offset: 0.0               # + afasta bico da mesa | - aproxima
# --- Posicao do dock (CALIBRAR na sua maquina) ---
params_park_x: 214.5                # CALIBRAR
params_park_y: 18                # CALIBRAR
params_park_z: 246                # CALIBRAR
# --- Caminho de pega/largada (StealthChanger) --- (idem T0)
params_dropoff_path: [{'z':3.5, 'y':4}, {'z':0, 'y':0}, {'z':-12, 'y':0}]
params_pickup_path: [{'z':-12, 'y':2}, {'z':-12, 'y':0}, {'z':1.5, 'y':0, 'f':0.5, 'verify':1}, {'z':0.5, 'y':2.5, 'f':0.5}, {'z':8, 'y':8}, ]  

#####################################################################
#   OptoTap  ·  1 probe por ferramenta  ·  fiacao REAL na Monster8 V2:
#     T0 -> PA8  (conector "3D TOUCH"/BLTouch da placa)
#     T1 -> PB13 (conector endstop "Z-")
#   OBS: o conector 3D TOUCH fornece 5V - confirme que o OptoTap aceita 5V e que
#        a saida de sinal e 3.3V-safe (PA8). Se ficar invertido, use ^! no pino.
#####################################################################
[tool_probe T0]
pin: ^PA8
tool: 0
z_offset: -1.30                     # maior negativo = bico + longe da mesa
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

[tool_probe T1]
pin: ^PB13
tool: 1
z_offset: -1.00                   # maior negativo = bico + longe da mesa
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

[tool_probe T2]
pin: ^ebb_t2:PB8
tool: 2
z_offset: -0.80                   # maior negativo = bico + longe da mesa
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

#  Coordenador central dos probes: fornece 'probe:z_virtual_endstop' (usado no
#  [stepper_z]), roteia comandos de probe p/ a ferramenta ativa e habilita
#  DETECT_ACTIVE_TOOL_PROBE. crash_mintime: tempo minimo de trigger p/ considerar
#  crash (nozzle deixou de tocar antes do esperado).
[tool_probe_endstop]
crash_mintime: 0.5

#####################################################################
#   Deteccao da ferramenta ativa no BOOT
#   Le o estado dos OptoTaps: a ferramenta cujo probe NAO esta disparado e a
#   MONTADA. Assim nao e preciso voltar pra T0 no fim de cada impressao.
#   Se NENHUMA estiver montada (todas docadas/disparadas) -> sem ferramenta
#   ativa; o PRINT_START seleciona a ferramenta antes de mexer no Z.
#####################################################################
[delayed_gcode _DETECT_TOOL_ON_BOOT]
initial_duration: 1
gcode:
    DETECT_ACTIVE_TOOL_PROBE
    # Inicializa o toolchanger com a ferramenta detectada pelo OptoTap (SEM mover).
    # Passamos T=<numero> explicito porque a deteccao e via tool_probe, nao via
    # detection_pin (o INITIALIZE_TOOLCHANGER "pelado" usaria detected_tool = None).
    {% set t = printer.tool_probe_endstop.active_tool_number %}
    {% if t is not none and t >= 0 %}
        INITIALIZE_TOOLCHANGER T={t}
    {% else %}
        RESPOND MSG="Boot: nenhuma ferramenta montada detectada - selecione uma antes de imprimir"
    {% endif %}

#####################################################################
#   Calibracao SEGURA da posicao do dock (por ferramenta)
#   Fluxo: TOOL_ALIGN_START -> jog manual ate alinhar -> TOOL_ALIGN_TEST
#          (repete jog+test ate encaixar liso) -> TOOL_ALIGN_DONE.
#   Roda em docking mode com params_path_speed=300 (lento) = seguro.
#   A ferramenta a alinhar precisa estar ATIVA (montada + detectada/inicializada).
#####################################################################
[gcode_macro TOOL_ALIGN_START]
gcode:
    DETECT_ACTIVE_TOOL_PROBE         # detecta pelo OptoTap qual esta montada
    {% set t = printer.tool_probe_endstop.active_tool_number %}
    {% if t is none or t < 0 %}
      { action_raise_error("Nenhuma ferramenta montada detectada - monte uma antes de alinhar") }
    {% endif %}
    INITIALIZE_TOOLCHANGER T={t}      # inicializa com a detectada (sem mover)
    _TOOL_ALIGN_START

[gcode_macro _TOOL_ALIGN_START]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    SET_TOOL_PARAMETER PARAMETER='params_path_speed' VALUE=300   # lento p/ calibrar
    ENTER_DOCKING_MODE
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
    G0 X{tool.params_park_x} Z{tool.params_park_z}
    G0 Y{tool.params_park_y|float + 100.0}          # aproxima 100mm antes do dock
    RESPOND TYPE=echo MSG='Faca o jog do bico ate alinhar com o dock, depois TOOL_ALIGN_TEST'

[gcode_macro TOOL_ALIGN_TEST]
gcode:
    {% set curpos = printer.gcode_move.gcode_position %}
    {% set expected_y = printer[printer.toolchanger.tool].params_park_y|float %}
    {% if curpos[1] > (expected_y + 40.0) %}
      RESPOND TYPE=error MSG='Teste abortado: bico ainda longe do dock em Y. Faca o jog ate o dock.'
    {% else %}
      SET_TOOL_PARAMETER PARAMETER='params_park_x' VALUE={curpos[0]}
      SET_TOOL_PARAMETER PARAMETER='params_park_y' VALUE={curpos[1]}
      SET_TOOL_PARAMETER PARAMETER='params_park_z' VALUE={curpos[2]}
      TEST_TOOL_DOCKING RESTORE_AXIS=XYZ
    {% endif %}

[gcode_macro TOOL_ALIGN_DONE]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    # SAVE_TOOL_PARAMETER grava via [save_variables]; se voce NAO tiver esse
    # bloco, ignore o erro e copie os params_park_* atuais pra mao no config.
    SAVE_TOOL_PARAMETER PARAMETER='params_park_x'
    SAVE_TOOL_PARAMETER PARAMETER='params_park_y'
    SAVE_TOOL_PARAMETER PARAMETER='params_park_z'
    RESET_TOOL_PARAMETER PARAMETER='params_path_speed'
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
    EXIT_DOCKING_MODE

#####################################################################
#   Teste de resistencia: dock/undock repetido da ferramenta ATIVA
#   Simula as trocas de um print real (larga + pega a mesma ferramenta N vezes,
#   com um movimento pela mesa no meio). Uso: DOCK_CYCLE_TEST [CYCLES=5] [DWELL=500]
#   Pre-requisitos: homado (G28) + ferramenta ativa (INITIALIZE_TOOLCHANGER T=0).
#   >>> Rode 1x TEST_TOOL_DOCKING sozinho ANTES, pra confirmar que a troca ja
#       esta limpa - so entao faca os 5 ciclos.
#####################################################################
[gcode_macro DOCK_CYCLE_TEST]
description: Dock/undock repetido da ferramenta ativa p/ simular trocas de um print
gcode:
    {% set cycles = params.CYCLES|default(5)|int %}
    {% set dwell = params.DWELL|default(500)|int %}
    {% set h = printer.toolhead.homed_axes %}
    {% if 'x' not in h or 'y' not in h or 'z' not in h %}
      { action_raise_error("Home tudo (G28) antes do DOCK_CYCLE_TEST") }
    {% endif %}
    {% if printer.toolchanger.tool_number < 0 %}
      { action_raise_error("Nenhuma ferramenta ativa - rode INITIALIZE_TOOLCHANGER T=0") }
    {% endif %}
    {% set tn = printer.toolchanger.tool_number %}
    RESPOND TYPE=echo MSG='DOCK_CYCLE_TEST: {cycles} ciclos (T{tn})'
    {% for i in range(cycles) %}
      RESPOND TYPE=echo MSG='>> Ciclo {i+1}/{cycles}'
      G90
      G0 X150 Y150 Z30 F15000       ; posicao "de impressao" (toolhead trabalhando)
      G4 P{dwell}
      UNSELECT_TOOL                 ; larga a ferramenta no dock (dropoff)
      SELECT_TOOL T={tn}            ; pega de volta (pickup)
      G4 P{dwell}
    {% endfor %}
    RESPOND TYPE=echo MSG='DOCK_CYCLE_TEST OK - {cycles} ciclos concluidos'
