# =============================================================================
#  BLTouch + Quad Gantry Level + Bed Mesh  ·  Voron 2.4 / MKS Monster8 V2
# -----------------------------------------------------------------------------
#  BLTouch: sinal no Z-MIN (PB13), servo/control no SERVO0 (PA8).
#  Offsets do Marlin: NOZZLE_TO_PROBE_OFFSET { -44, 1.1, -2.0 }.
#  z_offset abaixo e ponto de partida -> rodar PROBE_CALIBRATE e SAVE_CONFIG.
# =============================================================================

[bltouch]
sensor_pin: ^PB13
control_pin: PA8
x_offset: -44
y_offset: 1.1
z_offset: 2.0                     # CALIBRAR com PROBE_CALIBRATE
speed: 5.0
samples: 2
sample_retract_dist: 5.0
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
stow_on_each_sample: True

[safe_z_home]
home_xy_position: 152.5, 152.5    # centro da mesa 305x305
speed: 100
z_hop: 10
z_hop_speed: 8

#  Quad Gantry Level (4 motores Z). Substitui o G34/Z_STEPPER_AUTO_ALIGN do Marlin.
#  points = posicoes que o Marlin usava (Z_STEPPER_ALIGN_XY), perto dos 4 motores.
[quad_gantry_level]
#  gantry_corners = cantos fisicos onde as correias Z se prendem (fora da mesa).
#  VALORES ESTIMADOS para Voron 2.4 ~300 -> MEDIR/AJUSTAR na sua maquina.
gantry_corners:
    -60, -10
    360, 370
points:
    55, 25
    55, 289
    258, 289
    258, 25
speed: 80
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02
max_adjust: 10

#  Malha da mesa (Marlin: AUTO_BED_LEVELING_BILINEAR 5x5).
#  Area limitada pelo alcance do probe (x_offset -44).
[bed_mesh]
speed: 80
horizontal_move_z: 10
mesh_min: 40, 30
mesh_max: 260, 275
probe_count: 5, 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0
