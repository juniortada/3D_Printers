# =============================================================================
#  Quad Gantry Level + Bed Mesh  ·  Voron 2.4 / MKS Monster8 V2
# -----------------------------------------------------------------------------
#  O BLTouch FOI REMOVIDO. O probe de Z agora e o OptoTap POR FERRAMENTA
#  (ver toolchanger.cfg -> [tool_probe]/[tool_probe_endstop]). O QGL e o bed_mesh
#  usam o probe da ferramenta ATIVA; convencao: usar SEMPRE a T0 para QGL/Z final.
#  O [safe_z_home] tambem saiu -> substituido por [homing_override] (homing.cfg).
#
#  Offsets: o OptoTap mede pelo proprio bico (offset X/Y ~ 0). Os antigos offsets
#  do BLTouch (-44, 1.1) NAO valem mais. Recalibrar 'points' do QGL sem o -44.
# =============================================================================

#  Quad Gantry Level (4 motores Z). Substitui o G34/Z_STEPPER_AUTO_ALIGN do Marlin.
#  Com o OptoTap a sonda mede pelo PROPRIO bico (offset ~ 0), entao a sonda
#  alcanca a mesa toda - da p/ espalhar os 'points' ate perto das bordas.
#  Rodar sempre com a T0 acoplada (probe da ferramenta ativa).
[quad_gantry_level]
#  gantry_corners = cantos fisicos onde as correias Z se prendem (fora da mesa).
#  VALORES ESTIMADOS para Voron 2.4 ~300 -> MEDIR/AJUSTAR na sua maquina.
gantry_corners:
    -60, -10
    360, 370
points:
    60, 25
    60, 289
    300, 289
    300, 25
speed: 80
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02
max_adjust: 10

#  Malha da mesa (Marlin: AUTO_BED_LEVELING_BILINEAR 5x5).
#  Com OptoTap (offset ~0) da p/ ampliar a area util ate perto das bordas.
[bed_mesh]
speed: 80
horizontal_move_z: 10
mesh_min: 40, 30
mesh_max: 260, 275
probe_count: 5, 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0
