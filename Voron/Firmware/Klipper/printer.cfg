# =============================================================================
#  Voron 2.4  ·  MKS Monster8 V2 (STM32F407VGT6)  ·  Klipper
# -----------------------------------------------------------------------------
#  Migrado da config Marlin 2.1.2.5 desta mesma maquina.
#  Base: config oficial MKS "Voron 2.4 config/printer_v2.cfg"
#        (repo github.com/makerbase-mks/MKS-Monster8) com os valores REAIS
#        deste hardware sobrepostos. Ver reference/ para os originais.
#
#  Firmware MCU: compilar Klipper para STM32F407, bootloader 48KiB, USB.
#  Gravar: renomear out/klipper.bin -> mks_monster8.bin no SD e resetar a placa.
#  Ver README.md para o passo a passo completo.
# =============================================================================

[include steppers.cfg]
[include tmc.cfg]
[include extruder.cfg]
[include bed.cfg]
[include probe_leveling.cfg]
[include fans.cfg]
[include toolchanger.cfg]        # 2 ferramentas (Tapchanger/OptoTap + docks StealthChanger)
[include homing.cfg]             # homing_override: X sensorless -> Y -> Z via OptoTap (T0)
[rounded_path] 
[include macros.cfg]
[include mainsail.cfg]

#####################################################################
#   MCU
#####################################################################
[mcu]
## Obtenha o ID com "ls /dev/serial/by-id/*" no Raspberry e cole abaixo.
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_4B0037000751343036383737-if00

[mcu ebb_t2]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3E0050000E504D5930393920-if00

#####################################################################
#   Limites de movimento (conjunto "mais rapido")
#   Combina o melhor do Marlin com o recomendado pela MKS:
#     - XY: valores do Marlin (mais rapidos que as configs MKS)
#     - max_z_accel 300: recomendacao MKS v1 (Marlin usava 100)
#     - square_corner_velocity 5.0: padrao Klipper, mais agil que a
#       junction deviation 0.013 do Marlin
#   OBS: sustentar 5000 mm/s^2 pede INPUT SHAPER (ADXL345). Sem ele,
#   manter estes valores (comprovados no Marlin) e subir so apos calibrar.
#####################################################################
[printer]
kinematics: corexy
max_velocity: 350
max_accel: 5000
max_z_velocity: 30
max_z_accel: 500
square_corner_velocity: 5.0

[idle_timeout]
timeout: 3600

# Diagnostico de direcao dos motores (CoreXY). Pode remover depois de
# acertar os dir_pin. Habilita o comando FORCE_MOVE no console.
[force_move]
enable_force_move: True

#####################################################################
#   board_pins (aliases EXP1/EXP2)
#   Usados pelo display RepRapDiscount FGSC (ST7920) dirigido pela
#   propria Monster8 via EXP1/EXP2 (ver bloco [display] abaixo).
#####################################################################
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB2,  EXP1_3=PE11, EXP1_5=PD9, EXP1_7=PE15, EXP1_9=<GND>,
    EXP1_2=PE10, EXP1_4=PD10, EXP1_6=PD8, EXP1_8=PE7,  EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE9, EXP2_5=PE8, EXP2_7=PB11,  EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<3.3v>
    # EXP2_1/EXP2_6/EXP2_2 = MISO/MOSI/SCK do bus SPI1 (livres com o FGSC).

#####################################################################
#   Display - RepRapDiscount 128x64 Full Graphic Smart Controller
#   (ST7920) dirigido pela Monster8 via EXP1/EXP2. Encoder + clique
#   + beeper nativos. O leitor de SD do display NAO e usado pelo Klipper.
#####################################################################
[display]
lcd_type: st7920
cs_pin: EXP1_4
sclk_pin: EXP1_5
sid_pin: EXP1_3
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
#kill_pin: ^!EXP2_8

[output_pin beeper]
pin: EXP1_1

[exclude_object]

