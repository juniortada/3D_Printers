# =============================================================================
#  Mesa aquecida  ·  MKS Monster8 V2
# -----------------------------------------------------------------------------
#  Termistor = EPCOS 100K (TEMP_SENSOR_BED = 1 no Marlin).
#  No Marlin a mesa era bang-bang; aqui usamos PID -> rodar PID_CALIBRATE:
#     PID_CALIBRATE HEATER=heater_bed TARGET=100   (depois SAVE_CONFIG)
#  PID abaixo e placeholder (config oficial MKS) ate calibrar.
# =============================================================================

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
max_power: 1.0
control: pid
pid_Kp: 71.039
pid_Ki: 2.223
pid_Kd: 567.421
min_temp: 0
max_temp: 120                     # Marlin BED_MAXTEMP era 150; ajuste se precisar
