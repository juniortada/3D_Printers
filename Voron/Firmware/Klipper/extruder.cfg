# =============================================================================
#  Extrusor  ·  driver A4988 (standalone)  ·  MKS Monster8 V2 slot E0
# -----------------------------------------------------------------------------
#  Marlin: 575 steps/mm @16 microsteps -> rotation_distance = 3200/575 = 5.565
#  CALIBRAR: extrudar 100 mm e ajustar rotation_distance (ver README).
#  Termistor do hotend = ATC Semitec 104GT-2 (TEMP_SENSOR_0 = 5 no Marlin).
#  PID e o do Marlin como ponto de partida -> rodar PID_CALIBRATE depois.
#  Se o filamento sair ao contrario, inverta dir_pin (remova o "!").
# =============================================================================

[extruder]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
microsteps: 16                    # precisa casar com os jumpers do A4988
rotation_distance: 5.565          # CALIBRAR (Marlin = 575 steps/mm)
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200    # Marlin EXTRUDE_MAXLENGTH
heater_pin: PB1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
control: pid
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 285                     # Marlin HEATER_0_MAXTEMP 275 + margem
min_extrude_temp: 170
# Melhoria nova (nao existia no Marlin) - calibrar com TUNING_TOWER:
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

# =============================================================================
#  Extrusor T1  ·  driver A4988 (standalone)  ·  MKS Monster8 V2 slot E4
# -----------------------------------------------------------------------------
#  Segunda ferramenta do toolchanger. Hardware IDENTICO ao T0:
#  Voron M4 bowden, mesmo motor, mesmos steps/mm, mesmo hotend (Bambu).
#  Por isso os valores mecanicos abaixo COPIAM o [extruder] acima.
#  >>> Slot FISICO E4 (o vazio a direita do z4 motor). No Klipper a secao
#      chama-se [extruder1] (2o extrusor) - NAO confundir com o slot E1 fisico,
#      que ja tem o z2 motor.
#  A4988 standalone: microsteps por jumper (16x, iguais ao E0) e Vref por
#  potenciometro (ajustar IGUAL ao E0, mesmo motor/corrente). Sem UART.
#  Se o filamento sair ao contrario, inverta dir_pin (adicione/remova "!").
# =============================================================================
[extruder1]
step_pin: PD13
dir_pin: PD12                     # inverter (!PD12) se extrudar ao contrario
enable_pin: !PD14
microsteps: 16                    # precisa casar com os jumpers do A4988
rotation_distance: 5.565          # COPIA do [extruder] (M4 identico) - confirmar 100 mm
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
heater_pin: PB0                   # HE1
sensor_type: ATC Semitec 104GT-2  # igual ao T0 (conferir termistor do Bambu)
sensor_pin: PC3                   # termistor livre (PC0=mesa, PC1=T0, PC2=camara)
control: pid
pid_Kp: 22.20                     # ponto de partida = T0 -> rodar PID_CALIBRATE HEATER=extruder1
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 285
min_extrude_temp: 170
# PA por ferramenta (roteamento/comprimento do bowden pode diferir do T0):
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
