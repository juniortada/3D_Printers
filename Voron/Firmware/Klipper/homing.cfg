# =============================================================================
#  Homing  ·  Voron 2.4 (CoreXY + quad gantry)  ·  MKS Monster8 V2
# -----------------------------------------------------------------------------
#  Substitui o antigo [safe_z_home]. Ordem do G28:
#     1) X  -> SENSORLESS (StallGuard, ver tmc.cfg) com corrente reduzida
#     2) Y  -> endstop fisico (PA15)
#     3) Z  -> OptoTap da ferramenta ATIVA, no centro da mesa
#  Z EXIGE uma ferramenta acoplada (o probe e o OptoTap dela). Sem ferramenta
#  ativa o G28 Z falha de proposito.
# =============================================================================

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Levanta o portico ~5mm antes de mover XY, SO se o Z ainda nao foi homado
    # (evita usar um zero falso num G28 Z de re-home apos QGL). Usa force_move.
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0
        G90
        G0 Z5 F600
    {% endif %}

    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}
    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}
    {% if home_all or 'Z' in params %}
        _HOME_Z
    {% endif %}

#  X sensorless: baixa a corrente p/ leitura de stall mais limpa, dwell p/ o
#  StallGuard estabilizar, homa, restaura a corrente e afasta do fim de curso.
[gcode_macro _HOME_X]
gcode:
    {% set run_cur = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set home_cur = 0.70 %}                 # CALIBRAR junto com o SGTHRS
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
    G4 P250
    G28 X
    G4 P250
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_cur}
    # afasta ~10mm do fim de curso (X homa no MAX -> anda no negativo)
    G91
    G1 X-10 F1800
    G90

[gcode_macro _HOME_Y]
gcode:
    G28 Y
    G91
    G1 Y-10 F1800
    G90

#  Z pelo OptoTap: precisa de X/Y homados e ferramenta ativa. Como o OptoTap
#  mede pelo proprio bico (offset ~0), o centro do probe = centro da mesa.
[gcode_macro _HOME_Z]
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("Home X e Y antes do Z") }
    {% endif %}
    G90
    G0 X152.5 Y152.5 F6000                     # centro da mesa (300x300)
    G28 Z
    G0 Z10 F600
