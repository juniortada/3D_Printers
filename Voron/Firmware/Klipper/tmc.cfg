# =============================================================================
#  Drivers TMC2209 (UART)  ·  MKS Monster8 V2
# -----------------------------------------------------------------------------
#  X/Y/Z + os 3 Z extras sao TMC2209 em UART (1 pino por driver).
#  Correntes do Marlin: X/Y = 1100 mA RMS -> 1.1 A ; Z = 800 mA -> 0.8 A.
#  stealthchop_threshold:
#     0       -> sempre spreadcycle (Marlin: XY em spreadcycle)
#     999999  -> sempre stealthchop  (Marlin: STEALTHCHOP_Z ligado)
#
#  >>> O EXTRUSOR usa A4988 (standalone), NAO TMC. Por isso NAO ha
#      [tmc2209 extruder] aqui. Microsteps do extrusor sao por jumper (16x).
#      (Upgrade opcional: se trocar o A4988 por um TMC2209 no slot E0,
#       descomente o bloco no fim deste arquivo, uart_pin: PB3.)
# =============================================================================

#  X em SENSORLESS HOMING (o shuttle do Tapchanger e curto demais p/ um switch).
#  diag_pin: DIAG do Driver0 (PA14) -> instalar o JUMPER DIAG no slot do driver X.
#  driver_SGTHRS: sensibilidade do StallGuard (0-255). MAIOR = dispara mais facil.
#     Se o X bate no fim sem parar -> AUMENTE. Se para no meio do curso -> DIMINUA.
#     Calibrar com os motores na TEMPERATURA DE OPERACAO (o stall varia com o calor).
#  stealthchop_threshold: 0 -> sempre spreadcycle (StallGuard EXIGE spreadcycle).
[tmc2209 stepper_x]
uart_pin: PE6
interpolate: True
run_current: 1.1
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PA14
driver_SGTHRS: 60                 # CALIBRAR (ver nota acima)

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 1.1
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PB7
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PD4
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z2]
uart_pin: PD0
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z3]
uart_pin: PD15
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

