# =============================================================================
#  Drivers TMC2209 (UART)  ·  MKS Monster8 V2
# -----------------------------------------------------------------------------
#  X/Y/Z + os 3 Z extras sao TMC2209 em UART (1 pino por driver).
#  Correntes do Marlin: X/Y = 1100 mA RMS -> 1.1 A ; Z = 800 mA -> 0.8 A.
#  stealthchop_threshold:
#     0       -> sempre spreadcycle (Marlin: XY em spreadcycle)
#     999999  -> sempre stealthchop  (Marlin: STEALTHCHOP_Z ligado)
#
#  >>> O EXTRUSOR usa A4988 (standalone), NAO TMC. Por isso NAO ha
#      [tmc2209 extruder] aqui. Microsteps do extrusor sao por jumper (16x).
#      (Upgrade opcional: se trocar o A4988 por um TMC2209 no slot E0,
#       descomente o bloco no fim deste arquivo, uart_pin: PB3.)
# =============================================================================

#  X em SENSORLESS HOMING (o shuttle do Tapchanger e curto demais p/ um switch).
#  Segue o procedimento oficial do Klipper (TMC_Drivers.html):
#   - driver_SGTHRS: 255 = MAIS sensivel, 0 = menos. COMECAR em 255 e ir DIMINUINDO
#     ate achar a maior sensibilidade que ainda chega ao fim, depois a menor que
#     ainda homa com "single touch"; valor final = min + (max-min)/3.
#   - SEM hold_current (o doc EXIGE remover no sensorless: reduzir corrente com o
#     carro pressionado no fim pode move-lo).
#   - stealthchop_threshold: 0 -> sempre spreadcycle (StallGuard exige spreadcycle).
[tmc2209 stepper_x]
uart_pin: PE6
interpolate: True
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PA14
driver_SGTHRS: 255                # COMECAR no maximo e DIMINUIR (ver nota acima)

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 1.1
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PB7
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PD4
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z2]
uart_pin: PD0
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z3]
uart_pin: PD15
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

