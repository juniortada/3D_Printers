# =============================================================================
#  Steppers  ·  CoreXY + 4x Z (quad gantry)  ·  MKS Monster8 V2
# -----------------------------------------------------------------------------
#  Polaridades de dir_pin e endstop seguem a config oficial MKS Voron 2.4.
#  Se um eixo mover ao contrario, inverta o dir_pin (adicione/remova "!").
#  Se o homing X/Y bater longe do switch, inverta o endstop (! no endstop_pin).
#  X/Y: rotation_distance 40 (polia 20T GT2, 80 steps/mm @16ust no Marlin).
#  Z:   rotation_distance 40 + gear_ratio 80:16 (= 8mm/rev, 400 steps/mm).
# =============================================================================

[stepper_x]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200      # 400 para motor 0.9 graus
endstop_pin: PA14                 # X-max (Driver0 DIAG). '!' inverte se NC
position_min: 0
position_endstop: 305
position_max: 305
homing_speed: 80
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: PA15                 # Y-max (Driver1 DIAG)
position_min: 0
position_endstop: 305
position_max: 305
homing_speed: 80
homing_retract_dist: 5
homing_positive_dir: true

#  Os 4 motores Z: Z (Driver2), Z1 (E1), Z2 (E2), Z3 (E3).
#  Homing de Z via BLTouch (probe:z_virtual_endstop).
[stepper_z]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
step_pin: PD6
dir_pin: PD5
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16

[stepper_z2]
step_pin: PD2
dir_pin: PD1
enable_pin: !PD3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16

[stepper_z3]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
