# =============================================================================
#  Base Mainsail / Moonraker  ·  secoes essenciais + PAUSE/RESUME
# -----------------------------------------------------------------------------
#  >>> IMPORTANTE: esta config JA fornece virtual_sdcard, pause_resume,
#      display_status, exclude_object e as macros PAUSE/RESUME.
#      NAO inclua tambem o "mainsail.cfg" padrao do MainsailOS, senao havera
#      secoes duplicadas. Se o printer.cfg gerado pelo MainsailOS tiver
#      "[include mainsail.cfg]" apontando para o arquivo do pacote, remova-o.
# =============================================================================

[virtual_sdcard]
path: ~/printer_data/gcodes        # MainsailOS atual. (Versoes antigas: ~/gcode_files)
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]

[exclude_object]

[gcode_macro PAUSE]
description: Pausa a impressao e estaciona o bico
rename_existing: PAUSE_BASE
variable_park_x: 152.5
variable_park_y: 300
variable_z_hop: 10
gcode:
    {% set E = 1.0 %}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude %}
        G1 E-{E} F2100
    {% endif %}
    {% if (printer.gcode_move.position.z + z_hop) < printer.toolhead.axis_maximum.z %}
        G1 Z{z_hop} F900
    {% endif %}
    G90
    G1 X{park_x} Y{park_y} F6000

[gcode_macro RESUME]
description: Retoma a impressao
rename_existing: RESUME_BASE
gcode:
    {% set E = 1.0 %}
    G91
    {% if printer.extruder.can_extrude %}
        G1 E{E} F2100
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1
    RESUME_BASE
